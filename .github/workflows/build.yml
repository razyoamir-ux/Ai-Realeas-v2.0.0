
name: Build Varnix AI Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ] || \
             [ -z "$STORE_PASSWORD" ] || \
             [ -z "$KEY_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: Release signing secrets are missing."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > android/app/varnix-release-key.jks

          if [ ! -s android/app/varnix-release-key.jks ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          keytool -list \
            -keystore android/app/varnix-release-key.jks \
            -storetype PKCS12 \
            -storepass "$STORE_PASSWORD" \
            >/dev/null

          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=varnix-release-key.jks
          storeType=PKCS12
          EOF

          echo "Release keystore prepared successfully."

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Varnix-AI-2.0.0-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
